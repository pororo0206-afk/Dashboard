<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이노바이드 정산 대시보드 2024-2025</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    background: #f5f7fa;
    color: #1a202c;
    padding: 24px;
    line-height: 1.5;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 4px; color: #1a202c; }
  .subtitle { color: #718096; font-size: 13px; margin-bottom: 20px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    border: 1px solid #e2e8f0;
  }
  .card-label { font-size: 12px; color: #718096; margin-bottom: 6px; }
  .card-value { font-size: 22px; font-weight: 700; color: #2d3748; }
  .card-sub { font-size: 11px; color: #a0aec0; margin-top: 4px; }

  .controls {
    background: white;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #e2e8f0;
  }
  .control-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .control-row:last-child { margin-bottom: 0; }
  .control-label {
    font-size: 12px;
    font-weight: 600;
    color: #4a5568;
    min-width: 70px;
  }
  .btn {
    padding: 6px 12px;
    border: 1px solid #cbd5e0;
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: #4a5568;
    transition: all .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #edf2f7; }
  .btn.active {
    background: #3182ce;
    color: white;
    border-color: #3182ce;
  }
  .search-input {
    padding: 7px 10px;
    border: 1px solid #cbd5e0;
    border-radius: 6px;
    font-size: 13px;
    width: 260px;
    outline: none;
  }
  .search-input:focus { border-color: #3182ce; }

  .table-wrapper {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
  }
  .table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #f7fafc;
    border-bottom: 1px solid #e2e8f0;
    font-size: 13px;
  }
  .table-summary { color: #4a5568; font-weight: 500; }
  .table-summary strong { color: #2b6cb0; }

  .table-scroll { overflow-x: auto; max-height: 65vh; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead {
    position: sticky;
    top: 0;
    background: #2d3748;
    color: white;
    z-index: 1;
  }
  th {
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    font-size: 12px;
  }
  th:hover { background: #4a5568; }
  th .sort-icon { opacity: .4; margin-left: 4px; font-size: 10px; }
  th.sorted-asc .sort-icon, th.sorted-desc .sort-icon { opacity: 1; }
  td {
    padding: 9px 12px;
    border-bottom: 1px solid #edf2f7;
    white-space: nowrap;
  }
  tbody tr:hover { background: #f7fafc; }
  .amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
  .amount.negative { color: #e53e3e; }
  .amount.zero { color: #a0aec0; }
  .status-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .status-COMPLETED { background: #c6f6d5; color: #22543d; }
  .status-CONFIRMED { background: #feebc8; color: #7b341e; }
  .status-MODIFIED { background: #e9d8fd; color: #553c9a; }

  .empty-state {
    padding: 48px;
    text-align: center;
    color: #a0aec0;
    font-size: 14px;
  }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .search-input { width: 100%; }
    .card-value { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>이노바이드 정산 대시보드</h1>
  <p class="subtitle">2024-2025 기공소 정산 내역 · 전체 209건</p>

  <div class="cards" id="summaryCards"></div>

  <div class="controls">

  </div>

  <div class="table-wrapper">
    <div class="table-header">
      <div class="table-summary" id="tableSummary"></div>

    <div class="table-scroll">
      <table>
        <thead>

            <th data-col="year">연도<span class="sort-icon">↕</span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

const state = {
  year: 'ALL',
  status: 'ALL',
  lab: 'ALL',
  search: '',
  sortCol: 'date',
  sortDir: 'desc'
};

const fmt = (n) => n.toLocaleString('ko-KR');
const fmtAmount = (n) => {
  if (n === 0) return '0';
  if (n < 0) return '(' + fmt(Math.abs(n)) + ')';
  return fmt(n);
};

function renderSummaryCards() {
  const totalSum = DATA.reduce((a, r) => a + r.amount, 0);
  const sum2024 = DATA.filter(r => r.year === 2024).reduce((a, r) => a + r.amount, 0);
  const sum2025 = DATA.filter(r => r.year === 2025).reduce((a, r) => a + r.amount, 0);
  const labs = new Set(DATA.map(r => r.lab)).size;
  const negCount = DATA.filter(r => r.amount < 0).length;

  document.getElementById('summaryCards').innerHTML = `
    <div class="card"><div class="card-label">전체 합계</div><div class="card-value">${fmt(totalSum)}</div><div class="card-sub">KRW · 총 ${DATA.length}건</div></div>
    <div class="card"><div class="card-label">2024년</div><div class="card-value">${fmt(sum2024)}</div><div class="card-sub">KRW · ${DATA.filter(r=>r.year===2024).length}건</div></div>
    <div class="card"><div class="card-label">2025년</div><div class="card-value">${fmt(sum2025)}</div><div class="card-sub">KRW · ${DATA.filter(r=>r.year===2025).length}건</div></div>
    <div class="card"><div class="card-label">기공소 수</div><div class="card-value">${labs}</div><div class="card-sub">고유 기공소</div></div>
    <div class="card"><div class="card-label">환불/조정 건</div><div class="card-value" style="color:#e53e3e;">${negCount}</div><div class="card-sub">음수 금액</div></div>
  `;
}

function renderFilterButtons() {
  // Year
  const years = ['ALL', ...new Set(DATA.map(r => r.year))].sort();
  document.getElementById('yearFilter').innerHTML = years.map(y =>
    `<button class="btn ${state.year === y ? 'active' : ''}" data-year="${y}">${y === 'ALL' ? '전체' : y + '년'}</button>`
  ).join(' ');

  // Status
  const statuses = ['ALL', 'COMPLETED', 'CONFIRMED', 'MODIFIED'];
  document.getElementById('statusFilter').innerHTML = statuses.map(s =>
    `<button class="btn ${state.status === s ? 'active' : ''}" data-status="${s}">${s === 'ALL' ? '전체' : s}</button>`
  ).join(' ');

  // Lab - sort by total amount desc
  const labSums = {};
  DATA.forEach(r => { labSums[r.lab] = (labSums[r.lab] || 0) + r.amount; });
  const labs = ['ALL', ...Object.keys(labSums).sort((a, b) => labSums[b] - labSums[a])];
  document.getElementById('labFilter').innerHTML = labs.map(l =>
    `<button class="btn ${state.lab === l ? 'active' : ''}" data-lab="${l}">${l === 'ALL' ? '전체' : l}</button>`
  ).join('');
}

function getFiltered() {
  let rows = DATA;
  if (state.year !== 'ALL') rows = rows.filter(r => r.year === Number(state.year));
  if (state.status !== 'ALL') rows = rows.filter(r => r.status === state.status);
  if (state.lab !== 'ALL') rows = rows.filter(r => r.lab === state.lab);
  if (state.search) {
    const q = state.search.toLowerCase();
    rows = rows.filter(r =>
      r.lab.toLowerCase().includes(q) ||
      r.creator.toLowerCase().includes(q) ||
      String(r.id).includes(q)
    );
  }
  // Sort
  const dir = state.sortDir === 'asc' ? 1 : -1;
  rows = [...rows].sort((a, b) => {
    const va = a[state.sortCol], vb = b[state.sortCol];
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
    return String(va).localeCompare(String(vb), 'ko') * dir;
  });
  return rows;
}

function renderTable() {
  const rows = getFiltered();
  const sum = rows.reduce((a, r) => a + r.amount, 0);

  document.getElementById('tableSummary').innerHTML =
    `표시: <strong>${rows.length}</strong>건 · 합계: <strong>${fmt(sum)}</strong> KRW`;

  // Update sort icon states on headers
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    const icon = th.querySelector('.sort-icon');
    if (th.dataset.col === state.sortCol) {
      th.classList.add(state.sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
      icon.textContent = state.sortDir === 'asc' ? '▲' : '▼';
    } else {
      icon.textContent = '↕';
    }
  });

  const tbody = document.getElementById('tableBody');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">조건에 맞는 데이터가 없습니다</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.id}</td>
      <td>${r.lab}</td>
      <td class="amount ${r.amount < 0 ? 'negative' : r.amount === 0 ? 'zero' : ''}">${fmtAmount(r.amount)}</td>
      <td>${r.dateTime}</td>
      <td><span class="status-pill status-${r.status}">${r.status}</span></td>
      <td>${r.creator}</td>
      <td>${r.year}</td>
    </tr>
  `).join('');
}

function bindEvents() {
  document.getElementById('yearFilter').addEventListener('click', e => {
    if (e.target.dataset.year) { state.year = e.target.dataset.year; renderFilterButtons(); renderTable(); }
  });
  document.getElementById('statusFilter').addEventListener('click', e => {
    if (e.target.dataset.status) { state.status = e.target.dataset.status; renderFilterButtons(); renderTable(); }
  });
  document.getElementById('labFilter').addEventListener('click', e => {
    if (e.target.dataset.lab) { state.lab = e.target.dataset.lab; renderFilterButtons(); renderTable(); }
  });
  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value; renderTable();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    state.year = 'ALL'; state.status = 'ALL'; state.lab = 'ALL'; state.search = '';
    document.getElementById('searchInput').value = '';
    renderFilterButtons(); renderTable();
  });
  document.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (state.sortCol === col) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortCol = col; state.sortDir = 'desc'; }
      renderTable();
    });
  });
}

renderSummaryCards();
renderFilterButtons();
bindEvents();
renderTable();
</script>
